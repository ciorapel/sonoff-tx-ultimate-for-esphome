substitutions:
  name: intrerupator_default
  friendly_name: "Intrerupator Default"
  relay_count: "2"
  relay_2_internal: "false"
  relay_3_internal: "true"

  relay_1_coupled: "true"
  relay_2_coupled: "true"
  relay_3_coupled: "true"

  vibra_time: "150ms"
  button_on_time: "200ms"

  button_brightness_default: "0.4"
  button_color_default: "{100,100,100}"

  button_brightness_nightlight: "0.7"
  button_color_nightlight: "{100,80,60}"

  nightlight_brightness: "0.3"
  nightlight_color: "{100,70,50}"

  touch_brightness: "1"
  touch_color: "{100,100,100}"
  touch_effect: "Pulse click"

  long_press_brightness: "1"
  long_press_color: "{100,0,0}"
  long_press_effect: "Pulse"

  multi_touch_brightness: "1"
  multi_touch_color: "{0,0,100}"
  multi_touch_effect: "Pulse"

  swipe_left_brightness: "0.8"
  swipe_left_color: "{0,100,0}"
  swipe_left_effect: "Pulse"

  swipe_right_brightness: "1"
  swipe_right_color: "{100,70,0}"
  swipe_right_effect: "Pulse"

  relay_1_pin: GPIO18
  relay_2_pin: GPIO17
  relay_3_pin: GPIO27

  neopixel_light_id: light.${name}_neopixel_light

  vibra_motor_pin: GPIO21
  pa_power_pin: GPIO26
  uart_tx_pin: GPIO19
  uart_rx_pin: GPIO22
  touchpanel_power_pin: GPIO5
  led_pin: GPIO13

  # ESP-NOW Sync Configuration
  espnow_sync_enabled: "false"
  espnow_partner_mac: "00:00:00:00:00:00"
  espnow_is_master: "false"

i2s_audio:
  - id: if_i2s_audio
    i2s_bclk_pin: GPIO2
    i2s_lrclk_pin: GPIO4

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: smarthomeyourself-crpl.tx_ultimate
    version: "2.2"

  on_boot:
    priority: -100
    then:
      - binary_sensor.template.publish:
          id: touchfield_1
          state: OFF
      - binary_sensor.template.publish:
          id: touchfield_2
          state: OFF
      - binary_sensor.template.publish:
          id: touchfield_3
          state: OFF
      - binary_sensor.template.publish:
          id: multi_touch
          state: OFF
      - binary_sensor.template.publish:
          id: swipe_left
          state: OFF
      - binary_sensor.template.publish:
          id: swipe_right
          state: OFF
      - binary_sensor.template.publish:
          id: long_press
          state: OFF
      - script.execute: refresh_led_default
      - if:
          condition:
            lambda: "return ${espnow_sync_enabled} && ${espnow_is_master};"
          then:
            - delay: 5s
            - script.execute: espnow_sync_initial_state

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO
  logs:
    binary_sensor: WARN
    light: WARN
    script: WARN
    switch: WARN
    tx_ultimate_touch: INFO
    uart_debug: WARN
    media_player: INFO
    espnow: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 0s
  ap:
    password: "123456789"

improv_serial:

captive_portal:

external_components:
  - source:
      type: git
      url: https://github.com/ciorapel/sonoff-tx-ultimate-for-esphome
      ref: main
    components: [tx_ultimate_touch]
    refresh: 1d
  - source: github://nrandell/espnow
    components: [espnow]
    refresh: 1d

espnow:

preferences:
  flash_write_interval: 5min

globals:
  - id: button_brightness
    type: float
    restore_value: no
    initial_value: ${button_brightness_default}
  - id: button_color
    type: int[3]
    restore_value: no
    initial_value: ${button_color_default}
  - id: nightlight_color
    type: int[3]
    restore_value: no
    initial_value: ${nightlight_color}
  - id: long_press_color
    type: int[3]
    restore_value: no
    initial_value: ${long_press_color}
  - id: multi_touch_color
    type: int[3]
    restore_value: no
    initial_value: ${multi_touch_color}
  - id: swipe_left_color
    type: int[3]
    restore_value: no
    initial_value: ${swipe_left_color}
  - id: swipe_right_color
    type: int[3]
    restore_value: no
    initial_value: ${swipe_right_color}
  - id: touch_color
    type: int[3]
    restore_value: no
    initial_value: ${touch_color}
  - id: original_relay_1_coupled
    type: bool
    restore_value: no
    initial_value: ${relay_1_coupled}
  - id: original_relay_2_coupled
    type: bool
    restore_value: no
    initial_value: ${relay_2_coupled}
  - id: original_relay_3_coupled
    type: bool
    restore_value: no
    initial_value: ${relay_3_coupled}
  - id: runtime_relay_1_coupled
    type: bool
    initial_value: ${relay_1_coupled}
    restore_value: no
  - id: runtime_relay_2_coupled
    type: bool
    restore_value: no
    initial_value: ${relay_2_coupled}
  - id: runtime_relay_3_coupled
    type: bool
    restore_value: no
    initial_value: ${relay_3_coupled}
  - id: ha_connection_lost
    type: bool
    restore_value: no
    initial_value: "false"
  - id: multitouch_action_turn_on
    type: bool
    restore_value: no
    initial_value: "true"
  - id: espnow_sync_in_progress
    type: bool
    restore_value: no
    initial_value: "false"

binary_sensor:
  - platform: status
    name: "Connection Status"
    id: connection_status
    on_press:
      then:
        - lambda: |-
            id(runtime_relay_1_coupled) = id(original_relay_1_coupled);
            id(runtime_relay_2_coupled) = id(original_relay_2_coupled);
            id(runtime_relay_3_coupled) = id(original_relay_3_coupled);
            id(ha_connection_lost) = false;
        - script.execute: refresh_led_default
    on_release:
      then:
        - lambda: |-
            id(ha_connection_lost) = true;
            id(runtime_relay_1_coupled) = true;
            id(runtime_relay_2_coupled) = true;
            id(runtime_relay_3_coupled) = true;
        - script.execute: refresh_led_default

  - platform: homeassistant
    id: ha_neopixel_active
    entity_id: ${neopixel_light_id}
    internal: true

  - platform: espnow
    mac_address: ${espnow_partner_mac}
    name: "Partner Button 1"
    id: partner_button_1_espnow
    internal: true
    on_press:
      - if:
          condition:
            and:
              - lambda: "return ${espnow_sync_enabled};"
              - lambda: "return !id(espnow_sync_in_progress);"
          then:
            - lambda: "id(espnow_sync_in_progress) = true;"
            - logger.log: "ESP-NOW: Primesc L1 ON de la partner"
            # Logica simplă: aplică la DUMMY dacă există, altfel la L
            - if:
                condition:
                  lambda: "return !${relay_1_coupled};"  # Are DUMMY
                then:
                  - logger.log: "  → Aplicând la DUMMY L1"
                  - switch.turn_on: dummy_relay_1
                else:
                  - logger.log: "  → Aplicând la L1 fizic"
                  - switch.turn_on: relay_1
            - delay: 200ms
            - lambda: "id(espnow_sync_in_progress) = false;"
    on_release:
      - if:
          condition:
            and:
              - lambda: "return ${espnow_sync_enabled};"
              - lambda: "return !id(espnow_sync_in_progress);"
          then:
            - lambda: "id(espnow_sync_in_progress) = true;"
            - logger.log: "ESP-NOW: Primesc L1 OFF de la partner"
            - if:
                condition:
                  lambda: "return !${relay_1_coupled};"  # Are DUMMY
                then:
                  - logger.log: "  → Aplicând la DUMMY L1"
                  - switch.turn_off: dummy_relay_1
                else:
                  - logger.log: "  → Aplicând la L1 fizic"
                  - switch.turn_off: relay_1
            - delay: 200ms
            - lambda: "id(espnow_sync_in_progress) = false;"

  - platform: espnow
    mac_address: ${espnow_partner_mac}
    name: "Partner Button 2"
    id: partner_button_2_espnow
    internal: true
    on_press:
      - if:
          condition:
            and:
              - lambda: "return ${espnow_sync_enabled};"
              - lambda: "return !id(espnow_sync_in_progress);"
              - lambda: "return ${relay_count} >= 2;"
          then:
            - lambda: "id(espnow_sync_in_progress) = true;"
            - logger.log: "ESP-NOW: Primesc L2 ON de la partner"
            - if:
                condition:
                  lambda: "return !${relay_2_coupled};"  # Are DUMMY
                then:
                  - logger.log: "  → Aplicând la DUMMY L2"
                  - switch.turn_on: dummy_relay_2
                else:
                  - logger.log: "  → Aplicând la L2 fizic"
                  - switch.turn_on: relay_2
            - delay: 200ms
            - lambda: "id(espnow_sync_in_progress) = false;"
    on_release:
      - if:
          condition:
            and:
              - lambda: "return ${espnow_sync_enabled};"
              - lambda: "return !id(espnow_sync_in_progress);"
              - lambda: "return ${relay_count} >= 2;"
          then:
            - lambda: "id(espnow_sync_in_progress) = true;"
            - logger.log: "ESP-NOW: Primesc L2 OFF de la partner"
            - if:
                condition:
                  lambda: "return !${relay_2_coupled};"  # Are DUMMY
                then:
                  - logger.log: "  → Aplicând la DUMMY L2"
                  - switch.turn_off: dummy_relay_2
                else:
                  - logger.log: "  → Aplicând la L2 fizic"
                  - switch.turn_off: relay_2
            - delay: 200ms
            - lambda: "id(espnow_sync_in_progress) = false;"

  - platform: espnow
    mac_address: ${espnow_partner_mac}
    name: "Partner Button 3"
    id: partner_button_3_espnow
    internal: true
    on_press:
      - if:
          condition:
            and:
              - lambda: "return ${espnow_sync_enabled};"
              - lambda: "return !id(espnow_sync_in_progress);"
              - lambda: "return ${relay_count} >= 3;"
          then:
            - lambda: "id(espnow_sync_in_progress) = true;"
            - logger.log: "ESP-NOW: Primesc L3 ON de la partner"
            - if:
                condition:
                  lambda: "return !${relay_3_coupled};"  # Are DUMMY
                then:
                  - logger.log: "  → Aplicând la DUMMY L3"
                  - switch.turn_on: dummy_relay_3
                else:
                  - logger.log: "  → Aplicând la L3 fizic"
                  - switch.turn_on: relay_3
            - delay: 200ms
            - lambda: "id(espnow_sync_in_progress) = false;"
    on_release:
      - if:
          condition:
            and:
              - lambda: "return ${espnow_sync_enabled};"
              - lambda: "return !id(espnow_sync_in_progress);"
              - lambda: "return ${relay_count} >= 3;"
          then:
            - lambda: "id(espnow_sync_in_progress) = true;"
            - logger.log: "ESP-NOW: Primesc L3 OFF de la partner"
            - if:
                condition:
                  lambda: "return !${relay_3_coupled};"  # Am DUMMY
                then:
                  - logger.log: "  → Am DUMMY, sincronizez DOAR DUMMY L3"
                  - switch.turn_off: dummy_relay_3
                else:
                  - logger.log: "  → Nu am DUMMY, sincronizez DOAR L3 fizic"
                  - switch.turn_off: relay_3
            - delay: 200ms
            - lambda: "id(espnow_sync_in_progress) = false;"

  - platform: template
    name: "Touchfield 1"
    id: touchfield_1
    on_press:
      - if:
          condition:
            lambda: "return id(runtime_relay_1_coupled);"
          then:
            - switch.toggle: relay_1
          else:
            - switch.toggle: dummy_relay_1
      - delay: ${button_on_time}
      - binary_sensor.template.publish:
          id: touchfield_1
          state: OFF

  - platform: template
    name: "Touchfield 2"
    id: touchfield_2
    internal: ${relay_2_internal}
    on_press:
      - if:
          condition:
            lambda: "return id(runtime_relay_2_coupled);"
          then:
            - switch.toggle: relay_2
          else:
            - switch.toggle: dummy_relay_2
      - delay: ${button_on_time}
      - binary_sensor.template.publish:
          id: touchfield_2
          state: OFF

  - platform: template
    name: "Touchfield 3"
    id: touchfield_3
    internal: ${relay_3_internal}
    on_press:
      - if:
          condition:
            lambda: "return id(runtime_relay_3_coupled);"
          then:
            - switch.toggle: relay_3
          else:
            - switch.toggle: dummy_relay_3
      - delay: ${button_on_time}
      - binary_sensor.template.publish:
          id: touchfield_3
          state: OFF

  - platform: template
    name: "Swipe left"
    id: swipe_left
    on_press:
      - delay: ${button_on_time}
      - binary_sensor.template.publish:
          id: swipe_left
          state: OFF
      - script.execute: refresh_led_default

  - platform: template
    name: "Swipe_right"
    id: swipe_right
    on_press:
      - delay: ${button_on_time}
      - binary_sensor.template.publish:
          id: swipe_right
          state: OFF
      - script.execute: refresh_led_default

  - platform: template
    name: "Multi Touch"
    id: multi_touch
    on_press:
      - delay: ${button_on_time}
      - binary_sensor.template.publish:
          id: multi_touch
          state: OFF
      - script.execute: refresh_led_default

  - platform: template
    name: "Long Press"
    id: long_press
    on_press:
      - delay: ${button_on_time}
      - binary_sensor.template.publish:
          id: long_press
          state: OFF
      - script.execute: refresh_led_default

switch:
  - id: sw_audio_amplifier
    name: Audio Amplifier
    platform: gpio
    pin:
      number: GPIO26
      inverted: false
    restore_mode: ALWAYS_ON
    internal: true
    entity_category: config

  - platform: template
    name: "DND"
    id: dnd_mode
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    icon: "mdi:weather-night"

  - platform: template
    name: "Vibration"
    id: vibra_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    icon: "mdi:vibrate"

  - platform: espnow
    mac_address: ${espnow_partner_mac}
    name: "Send Button 1 State"
    id: espnow_send_button_1
    internal: true

  - platform: espnow
    mac_address: ${espnow_partner_mac}
    name: "Send Button 2 State"
    id: espnow_send_button_2
    internal: true

  - platform: espnow
    mac_address: ${espnow_partner_mac}
    name: "Send Button 3 State"
    id: espnow_send_button_3
    internal: true

  - platform: template
    id: dummy_relay_1
    name: "Dummy L1"
    optimistic: true
    internal: ${relay_1_coupled}
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      then:
        - script.execute: refresh_led_default
        - if:
            condition:
              and:
                - lambda: "return ${espnow_sync_enabled};"
                - lambda: "return !id(espnow_sync_in_progress);"
            then:
              - logger.log: "ESP-NOW: Trimit Button 1 ON către partner"
              - switch.turn_on: espnow_send_button_1
    on_turn_off:
      then:
        - script.execute: refresh_led_default
        - if:
            condition:
              and:
                - lambda: "return ${espnow_sync_enabled};"
                - lambda: "return !id(espnow_sync_in_progress);"
            then:
              - logger.log: "ESP-NOW: Trimit Button 1 OFF către partner"
              - switch.turn_off: espnow_send_button_1

  - platform: template
    id: dummy_relay_2
    name: "Dummy L2"
    optimistic: true
    internal: ${relay_2_coupled}
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      then:
        - script.execute: refresh_led_default
        - if:
            condition:
              and:
                - lambda: "return ${espnow_sync_enabled};"
                - lambda: "return !id(espnow_sync_in_progress);"
                - lambda: "return ${relay_count} >= 2;"
            then:
              - logger.log: "ESP-NOW: Trimit Button 2 ON către partner"
              - switch.turn_on: espnow_send_button_2
    on_turn_off:
      then:
        - script.execute: refresh_led_default
        - if:
            condition:
              and:
                - lambda: "return ${espnow_sync_enabled};"
                - lambda: "return !id(espnow_sync_in_progress);"
                - lambda: "return ${relay_count} >= 2;"
            then:
              - logger.log: "ESP-NOW: Trimit Button 2 OFF către partner"
              - switch.turn_off: espnow_send_button_2

  - platform: template
    id: dummy_relay_3
    name: "Dummy L3"
    optimistic: true
    internal: ${relay_3_coupled}
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      then:
        - script.execute: refresh_led_default
        - if:
            condition:
              and:
                - lambda: "return ${espnow_sync_enabled};"
                - lambda: "return !id(espnow_sync_in_progress);"
                - lambda: "return ${relay_count} >= 3;"
            then:
              - logger.log: "ESP-NOW: Trimit Button 3 ON către partner"
              - switch.turn_on: espnow_send_button_3
    on_turn_off:
      then:
        - script.execute: refresh_led_default
        - if:
            condition:
              and:
                - lambda: "return ${espnow_sync_enabled};"
                - lambda: "return !id(espnow_sync_in_progress);"
                - lambda: "return ${relay_count} >= 3;"
            then:
              - logger.log: "ESP-NOW: Trimit Button 3 OFF către partner"
              - switch.turn_off: espnow_send_button_3

  - platform: gpio
    id: relay_1
    name: "L1"
    pin: ${relay_1_pin}
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - if:
          condition:
            lambda: "return id(runtime_relay_1_coupled);"
          then:
            - script.execute: refresh_led_default
      - if:
          condition:
            and:
              - lambda: "return ${espnow_sync_enabled};"
              - lambda: "return !id(espnow_sync_in_progress);"
          then:
            - logger.log: "ESP-NOW: Trimit Button 1 ON către partner (de la relay)"
            - switch.turn_on: espnow_send_button_1
    on_turn_off:
      - if:
          condition:
            lambda: "return id(runtime_relay_1_coupled);"
          then:
            - script.execute: refresh_led_default
      - if:
          condition:
            and:
              - lambda: "return ${espnow_sync_enabled};"
              - lambda: "return !id(espnow_sync_in_progress);"
          then:
            - logger.log: "ESP-NOW: Trimit Button 1 OFF către partner (de la relay)"
            - switch.turn_off: espnow_send_button_1

  - platform: gpio
    id: relay_2
    name: "L2"
    internal: ${relay_2_internal}
    pin: ${relay_2_pin}
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - if:
          condition:
            lambda: "return id(runtime_relay_2_coupled);"
          then:
            - script.execute: refresh_led_default
      - if:
          condition:
            and:
              - lambda: "return ${espnow_sync_enabled};"
              - lambda: "return !id(espnow_sync_in_progress);"
              - lambda: "return ${relay_count} >= 2;"
          then:
            - logger.log: "ESP-NOW: Trimit Button 2 ON către partner (de la relay)"
            - switch.turn_on: espnow_send_button_2
    on_turn_off:
      - if:
          condition:
            lambda: "return id(runtime_relay_2_coupled);"
          then:
            - script.execute: refresh_led_default
      - if:
          condition:
            and:
              - lambda: "return ${espnow_sync_enabled};"
              - lambda: "return !id(espnow_sync_in_progress);"
              - lambda: "return ${relay_count} >= 2;"
          then:
            - logger.log: "ESP-NOW: Trimit Button 2 OFF către partner (de la relay)"
            - switch.turn_off: espnow_send_button_2

  - platform: gpio
    id: relay_3
    name: "L3"
    internal: ${relay_3_internal}
    pin: ${relay_3_pin}
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - if:
          condition:
            lambda: "return id(runtime_relay_3_coupled);"
          then:
            - script.execute: refresh_led_default
      - if:
          condition:
            and:
              - lambda: "return ${espnow_sync_enabled};"
              - lambda: "return !id(espnow_sync_in_progress);"
              - lambda: "return ${relay_count} >= 3;"
          then:
            - logger.log: "ESP-NOW: Trimit Button 3 ON către partner (de la relay)"
            - switch.turn_on: espnow_send_button_3
    on_turn_off:
      - if:
          condition:
            lambda: "return id(runtime_relay_3_coupled);"
          then:
            - script.execute: refresh_led_default
      - if:
          condition:
            and:
              - lambda: "return ${espnow_sync_enabled};"
              - lambda: "return !id(espnow_sync_in_progress);"
              - lambda: "return ${relay_count} >= 3;"
          then:
            - logger.log: "ESP-NOW: Trimit Button 3 OFF către partner (de la relay)"
            - switch.turn_off: espnow_send_button_3

  - platform: gpio
    id: vibra
    internal: True
    pin: ${vibra_motor_pin}
    name: "Vibration"
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - delay: ${vibra_time}
      - switch.turn_off: vibra

  - platform: gpio
    name: "touch panel power"
    pin:
      number: ${touchpanel_power_pin}
      inverted: true
    id: touch_power
    internal: true
    restore_mode: ALWAYS_ON

  - platform: template
    name: "Nightlight"
    id: nightlight_active
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      then:
        - script.execute: update_button_settings
        - script.execute: refresh_led_default
    on_turn_off:
      then:
        - script.execute: update_button_settings
        - script.execute: refresh_led_default

  - platform: restart
    name: "Restart"

speaker:
  - id: speaker_embedded
    platform: i2s_audio
    dac_type: external
    i2s_dout_pin: GPIO15
    i2s_audio_id: if_i2s_audio
    i2s_comm_fmt: stand_msb
    channel: mono
    timeout: never
    bits_per_sample: 16bit
    sample_rate: 24000
    buffer_duration: 250ms
  - platform: mixer
    id: mixer_speaker_embedded
    output_speaker: speaker_embedded
    source_speakers:
      - id: announcement_speaker_embedded
      - id: media_speaker_embedded
  - platform: resampler
    id: announcement_spk_resampling_input
    output_speaker: announcement_speaker_embedded
  - platform: resampler
    id: media_spk_resampling_input
    output_speaker: media_speaker_embedded

media_player:
  - id: mp_media_player
    name: Media Player
    internal: false
    platform: speaker
    codec_support_enabled: true
    buffer_size: 100000
    task_stack_in_psram: true
    announcement_pipeline:
      speaker: announcement_spk_resampling_input
      format: WAV
      num_channels: 1
      sample_rate: 24000
    media_pipeline:
      speaker: media_spk_resampling_input
      format: FLAC
      num_channels: 1
      sample_rate: 24000

button:
  - platform: factory_reset
    name: "Factory Reset (NVS)"

light:
  - platform: esp32_rmt_led_strip
    rgb_order: GRB
    chipset: ws2812
    max_refresh_rate: 33ms
    use_psram: false
    pin: ${led_pin}
    num_leds: 28
    name: "NeoPixel Light"
    id: leds
    effects:
      - addressable_rainbow:
          name: "Rainbow"
          speed: 30
          width: 8
      - pulse:
          name: "Pulse"
          transition_length: 1.4s
          update_interval: 1s
      - addressable_scan:
      - addressable_color_wipe:
      - addressable_twinkle:
      - addressable_random_twinkle:
      - addressable_fireworks:
      - addressable_fireworks:
          name: Revelion
          spark_probability: 20%
          use_random_color: true
          fade_out_rate: 120
    on_turn_off:
      then:
        - script.execute: refresh_led_default

  - platform: partition
    name: "LEDs Button right"
    id: leds_button_right
    internal: true
    segments:
      - id: leds
        from: 25
        to: 25
  - platform: partition
    name: "LEDs Button middle"
    id: leds_button_middle
    internal: true
    segments:
      - id: leds
        from: 23
        to: 23
  - platform: partition
    name: "LEDs Button left"
    id: leds_button_left
    internal: true
    segments:
      - id: leds
        from: 21
        to: 21

  - platform: partition
    name: "LEDs Nightlight"
    id: leds_nightlight
    internal: true
    segments:
      - id: leds
        from: 0
        to: 20
      - id: leds
        from: 22
        to: 22
      - id: leds
        from: 24
        to: 24
      - id: leds
        from: 26
        to: 27

  - platform: partition
    name: "LEDs bottom"
    id: leds_bottom
    internal: true
    segments:
      - id: leds
        from: 6
        to: 12
    effects:
      - addressable_scan:
          name: "Scan"
          scan_width: 1
          move_interval: 20ms
      - addressable_rainbow:
          name: "Rainbow"
          speed: 10
          width: 20
      - pulse:
          name: "Pulse"
          transition_length: 3s
          update_interval: 1s
          min_brightness: 30%
          max_brightness: 100%
      - pulse:
          name: "Pulse click"
          transition_length: 0.5s
          update_interval: 0.4s
          min_brightness: 30%
          max_brightness: 100%

uart:
  tx_pin: ${uart_tx_pin}
  rx_pin: ${uart_rx_pin}
  id: my_uart
  baud_rate: 115200
  data_bits: 8
  stop_bits: 1
  parity: NONE
  debug:
    direction: RX
    dummy_receiver: false
    after:
      timeout: 1s
      bytes: 1024
    sequence:
      - lambda: |-
          if (bytes.size() > 0) {
            UARTDebug::log_hex(direction, bytes, ' ');
          }

tx_ultimate_touch:
  id: tx_touch
  uart: my_uart

  on_press:
    - if:
        condition:
          lambda: |-
            return !id(dnd_mode).state && id(vibra_enabled).state;
        then:
          - switch.turn_on: vibra
    - script.execute: led_on_touch
    - lambda: >
        ESP_LOGD("tx_ultimate_touch.on_press", "Touch Position: %d / State: %d", touch.x, touch.state);

  on_release:
    - script.execute:
        id: handle_release
        pos: !lambda "return touch.x;"
    - lambda: >
        ESP_LOGD("tx_ultimate_touch.on_release", "Release Position: %d / State: %d", touch.x, touch.state);

  on_swipe_left:
    - script.execute: led_on_swipe_left
    - if:
        condition:
          lambda: |-
            return !id(dnd_mode).state && id(vibra_enabled).state;
        then:
          - switch.turn_on: vibra
    - binary_sensor.template.publish:
        id: swipe_left
        state: ON
    - lambda: >
        ESP_LOGD("tx_ultimate_touch.on_swipe_left", "Swipe Left Position: %d / State: %d", touch.x, touch.state);

  on_swipe_right:
    - script.execute: led_on_swipe_right
    - if:
        condition:
          lambda: |-
            return !id(dnd_mode).state && id(vibra_enabled).state;
        then:
          - switch.turn_on: vibra
    - binary_sensor.template.publish:
        id: swipe_right
        state: ON
    - lambda: >
        ESP_LOGD("tx_ultimate_touch.on_swipe_right", "Swipe Right Position: %d / State: %d", touch.x, touch.state);

  on_full_touch_release:
    - script.execute: led_on_full_touch
    - if:
        condition:
          lambda: |-
            return !id(dnd_mode).state && id(vibra_enabled).state;
        then:
          - switch.turn_on: vibra
    - binary_sensor.template.publish:
        id: multi_touch
        state: ON

    - lambda: |-
        std::vector<bool> relay_states;
        std::vector<std::string> relay_names;

        bool relay1_state = id(runtime_relay_1_coupled) ? id(relay_1).state : id(dummy_relay_1).state;
        relay_states.push_back(relay1_state);
        relay_names.push_back("relay_1");

        if (${relay_count} >= 2 && !${relay_2_internal}) {
          bool relay2_state = id(runtime_relay_2_coupled) ? id(relay_2).state : id(dummy_relay_2).state;
          relay_states.push_back(relay2_state);
          relay_names.push_back("relay_2");
        }

        if (${relay_count} >= 3 && !${relay_3_internal}) {
          bool relay3_state = id(runtime_relay_3_coupled) ? id(relay_3).state : id(dummy_relay_3).state;
          relay_states.push_back(relay3_state);
          relay_names.push_back("relay_3");
        }

        bool all_on = true;
        bool any_on = false;

        for (bool state : relay_states) {
          if (!state) all_on = false;
          if (state) any_on = true;
        }

        ESP_LOGD("multitouch", "Found %d non-internal relays, all_on: %d, any_on: %d",
                 relay_states.size(), all_on, any_on);

        id(multitouch_action_turn_on) = !all_on;

    - if:
        condition:
          lambda: "return id(multitouch_action_turn_on);"
        then:
          - logger.log: "MultiTouch: Aprind toate releele non-interne"

          - if:
              condition:
                lambda: "return id(runtime_relay_1_coupled);"
              then:
                - switch.turn_on: relay_1
              else:
                - switch.turn_on: dummy_relay_1
          - delay: 50ms

          - if:
              condition:
                lambda: "return ${relay_count} >= 2 && !${relay_2_internal};"
              then:
                - if:
                    condition:
                      lambda: "return id(runtime_relay_2_coupled);"
                    then:
                      - switch.turn_on: relay_2
                    else:
                      - switch.turn_on: dummy_relay_2
          - delay: 50ms

          - if:
              condition:
                lambda: "return ${relay_count} >= 3 && !${relay_3_internal};"
              then:
                - if:
                    condition:
                      lambda: "return id(runtime_relay_3_coupled);"
                    then:
                      - switch.turn_on: relay_3
                    else:
                      - switch.turn_on: dummy_relay_3
        else:
          - logger.log: "MultiTouch: Sting toate releele non-interne"

          - if:
              condition:
                lambda: "return id(runtime_relay_1_coupled);"
              then:
                - switch.turn_off: relay_1
              else:
                - switch.turn_off: dummy_relay_1
          - delay: 50ms

          - if:
              condition:
                lambda: "return ${relay_count} >= 2 && !${relay_2_internal};"
              then:
                - if:
                    condition:
                      lambda: "return id(runtime_relay_2_coupled);"
                    then:
                      - switch.turn_off: relay_2
                    else:
                      - switch.turn_off: dummy_relay_2
          - delay: 50ms

          - if:
              condition:
                lambda: "return ${relay_count} >= 3 && !${relay_3_internal};"
              then:
                - if:
                    condition:
                      lambda: "return id(runtime_relay_3_coupled);"
                    then:
                      - switch.turn_off: relay_3
                    else:
                      - switch.turn_off: dummy_relay_3

    - lambda: >
        ESP_LOGD("tx_ultimate_touch.on_full_touch_release", "Full Touch Release Position: %d / State: %d", touch.x, touch.state);

  on_long_touch_release:
    - script.execute: led_on_long_touch
    - if:
        condition:
          lambda: |-
            return !id(dnd_mode).state && id(vibra_enabled).state;
        then:
          - switch.turn_on: vibra
    - binary_sensor.template.publish:
        id: long_press
        state: ON
    - switch.toggle: nightlight_active
    - lambda: >
        ESP_LOGD("tx_ultimate_touch.on_long_touch_release", "Long Touch Release Position: %d / State: %d", touch.x, touch.state);

script:
  - id: update_button_settings
    mode: single
    then:
      - if:
          condition:
            lambda: "return id(nightlight_active).state;"
          then:
            - lambda: |-
                id(button_brightness) = ${button_brightness_nightlight};
                int nightlight[3] = ${button_color_nightlight};
                for (int i = 0; i < 3; i++) id(button_color)[i] = nightlight[i];
          else:
            - lambda: |-
                id(button_brightness) = ${button_brightness_default};
                int def[3] = ${button_color_default};
                for (int i = 0; i < 3; i++) id(button_color)[i] = def[i];

  - id: espnow_sync_initial_state
    mode: single
    then:
      - logger.log: "ESP-NOW: Încep sincronizarea inițială ca master"
      - lambda: "id(espnow_sync_in_progress) = true;"

      # Pentru L1 - verifică ce stare are (DUMMY sau L fizic)
      - lambda: |-
          bool relay1_state;
          if (!${relay_1_coupled}) {
            // Are DUMMY, ia starea de la DUMMY
            relay1_state = id(dummy_relay_1).state;
            ESP_LOGD("espnow", "Stare inițială L1 de la DUMMY: %s", relay1_state ? "ON" : "OFF");
          } else {
            // Are L fizic, ia starea de la relay
            relay1_state = id(runtime_relay_1_coupled) ? id(relay_1).state : id(dummy_relay_1).state;
            ESP_LOGD("espnow", "Stare inițială L1 de la L fizic: %s", relay1_state ? "ON" : "OFF");
          }

          if (relay1_state) {
            id(espnow_send_button_1).turn_on();
          } else {
            id(espnow_send_button_1).turn_off();
          }

      # Pentru L2 (dacă există)
      - if:
          condition:
            lambda: "return ${relay_count} >= 2;"
          then:
            - delay: 100ms
            - lambda: |-
                bool relay2_state;
                if (!${relay_2_coupled}) {
                  relay2_state = id(dummy_relay_2).state;
                  ESP_LOGD("espnow", "Stare inițială L2 de la DUMMY: %s", relay2_state ? "ON" : "OFF");
                } else {
                  relay2_state = id(runtime_relay_2_coupled) ? id(relay_2).state : id(dummy_relay_2).state;
                  ESP_LOGD("espnow", "Stare inițială L2 de la L fizic: %s", relay2_state ? "ON" : "OFF");
                }

                if (relay2_state) {
                  id(espnow_send_button_2).turn_on();
                } else {
                  id(espnow_send_button_2).turn_off();
                }

      # Pentru L3 (dacă există)
      - if:
          condition:
            lambda: "return ${relay_count} >= 3;"
          then:
            - delay: 100ms
            - lambda: |-
                bool relay3_state;
                if (!${relay_3_coupled}) {
                  relay3_state = id(dummy_relay_3).state;
                  ESP_LOGD("espnow", "Stare inițială L3 de la DUMMY: %s", relay3_state ? "ON" : "OFF");
                } else {
                  relay3_state = id(runtime_relay_3_coupled) ? id(relay_3).state : id(dummy_relay_3).state;
                  ESP_LOGD("espnow", "Stare inițială L3 de la L fizic: %s", relay3_state ? "ON" : "OFF");
                }

                if (relay3_state) {
                  id(espnow_send_button_3).turn_on();
                } else {
                  id(espnow_send_button_3).turn_off();
                }

      - delay: 500ms
      - lambda: "id(espnow_sync_in_progress) = false;"
      - logger.log: "ESP-NOW: Sincronizarea inițială completă"

  - id: refresh_led_default
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return !id(ha_neopixel_active).state;
          then:
            - light.turn_off: leds_bottom

            - if:
                condition:
                  lambda: "return (id(nightlight_active).state);"
                then:
                  - light.turn_on:
                      id: leds_bottom
                      brightness: ${nightlight_brightness}
                      red: !lambda "return id(nightlight_color)[0]/100.0;"
                      green: !lambda "return id(nightlight_color)[1]/100.0;"
                      blue: !lambda "return id(nightlight_color)[2]/100.0;"

            - if:
                condition:
                  lambda: "return (${relay_count}>1 && (id(runtime_relay_1_coupled) ? id(relay_1).state : id(dummy_relay_1).state));"
                then:
                  - script.execute: led_on_button_left
                else:
                  - script.execute: led_off_button_left

            - if:
                condition:
                  lambda: "return (${relay_count}==3 && (id(runtime_relay_2_coupled) ? id(relay_2).state : id(dummy_relay_2).state)) || (${relay_count}==1 && (id(runtime_relay_1_coupled) ? id(relay_1).state : id(dummy_relay_1).state));"
                then:
                  - script.execute: led_on_button_middle
                else:
                  - script.execute: led_off_button_middle

            - if:
                condition:
                  lambda: "return (${relay_count}==2 && (id(runtime_relay_2_coupled) ? id(relay_2).state : id(dummy_relay_2).state)) || (${relay_count}==3 && (id(runtime_relay_3_coupled) ? id(relay_3).state : id(dummy_relay_3).state));"
                then:
                  - script.execute: led_on_button_right
                else:
                  - script.execute: led_off_button_right

            - delay: 10ms

            - if:
                condition:
                  lambda: "return (id(nightlight_active).state);"
                then:
                  - script.execute: led_on_nightlight
                else:
                  - light.turn_off: leds_nightlight

          else:
            - logger.log: "Neopixel Light activ → refresh_led_default ignorat"

  - id: led_on_button_left
    mode: restart
    then:
      - light.turn_on:
          id: leds_button_left
          brightness: !lambda "return id(button_brightness);"
          red: !lambda "return id(button_color)[0]/100.0;"
          green: !lambda "return id(button_color)[1]/100.0;"
          blue: !lambda "return id(button_color)[2]/100.0;"

  - id: led_on_button_middle
    mode: restart
    then:
      - light.turn_on:
          id: leds_button_middle
          brightness: !lambda "return id(button_brightness);"
          red: !lambda "return id(button_color)[0]/100.0;"
          green: !lambda "return id(button_color)[1]/100.0;"
          blue: !lambda "return id(button_color)[2]/100.0;"

  - id: led_on_button_right
    mode: restart
    then:
      - light.turn_on:
          id: leds_button_right
          brightness: !lambda "return id(button_brightness);"
          red: !lambda "return id(button_color)[0]/100.0;"
          green: !lambda "return id(button_color)[1]/100.0;"
          blue: !lambda "return id(button_color)[2]/100.0;"

  - id: led_off_button_left
    mode: restart
    then:
      - if:
          condition:
            lambda: "return (id(nightlight_active).state);"
          then:
            - light.turn_on:
                id: leds_button_left
                brightness: ${nightlight_brightness}
                red: !lambda "return id(nightlight_color)[0]/100.0;"
                green: !lambda "return id(nightlight_color)[1]/100.0;"
                blue: !lambda "return id(nightlight_color)[2]/100.0;"
          else:
            - light.turn_off:
                id: leds_button_left

  - id: led_off_button_middle
    mode: restart
    then:
      - if:
          condition:
            lambda: "return (id(nightlight_active).state);"
          then:
            - light.turn_on:
                id: leds_button_middle
                brightness: ${nightlight_brightness}
                red: !lambda "return id(nightlight_color)[0]/100.0;"
                green: !lambda "return id(nightlight_color)[1]/100.0;"
                blue: !lambda "return id(nightlight_color)[2]/100.0;"
          else:
            - light.turn_off:
                id: leds_button_middle

  - id: led_off_button_right
    mode: restart
    then:
      - if:
          condition:
            lambda: "return (id(nightlight_active).state);"
          then:
            - light.turn_on:
                id: leds_button_right
                brightness: ${nightlight_brightness}
                red: !lambda "return id(nightlight_color)[0]/100.0;"
                green: !lambda "return id(nightlight_color)[1]/100.0;"
                blue: !lambda "return id(nightlight_color)[2]/100.0;"
          else:
            - light.turn_off:
                id: leds_button_right

  - id: led_on_nightlight
    mode: restart
    then:
      - light.turn_on:
          id: leds_nightlight
          brightness: ${nightlight_brightness}
          red: !lambda "return id(nightlight_color)[0]/100.0;"
          green: !lambda "return id(nightlight_color)[1]/100.0;"
          blue: !lambda "return id(nightlight_color)[2]/100.0;"

  - id: led_on_touch
    mode: restart
    then:
      - if:
          condition:
            and:
              - lambda: "return !id(ha_neopixel_active).state;"
              - lambda: "return !id(dnd_mode).state;"
          then:
            - light.turn_on:
                id: leds_bottom
                brightness: ${touch_brightness}
                red: !lambda "return id(touch_color)[0]/100.0;"
                green: !lambda "return id(touch_color)[1]/100.0;"
                blue: !lambda "return id(touch_color)[2]/100.0;"
                effect: ${touch_effect}

  - id: led_on_swipe_left
    mode: restart
    then:
      - if:
          condition:
            and:
              - lambda: "return !id(ha_neopixel_active).state;"
              - lambda: "return !id(dnd_mode).state;"
          then:
            - light.turn_on:
                id: leds_bottom
                brightness: ${swipe_left_brightness}
                red: !lambda "return id(swipe_left_color)[0]/100.0;"
                green: !lambda "return id(swipe_left_color)[1]/100.0;"
                blue: !lambda "return id(swipe_left_color)[2]/100.0;"
                effect: ${swipe_left_effect}

  - id: led_on_swipe_right
    mode: restart
    then:
      - if:
          condition:
            and:
              - lambda: "return !id(ha_neopixel_active).state;"
              - lambda: "return !id(dnd_mode).state;"
          then:
            - light.turn_on:
                id: leds_bottom
                brightness: ${swipe_right_brightness}
                red: !lambda "return id(swipe_right_color)[0]/100.0;"
                green: !lambda "return id(swipe_right_color)[1]/100.0;"
                blue: !lambda "return id(swipe_right_color)[2]/100.0;"
                effect: ${swipe_right_effect}

  - id: led_on_full_touch
    mode: restart
    then:
      - if:
          condition:
            and:
              - lambda: "return !id(ha_neopixel_active).state;"
              - lambda: "return !id(dnd_mode).state;"
          then:
            - light.turn_on:
                id: leds_bottom
                brightness: ${multi_touch_brightness}
                red: !lambda "return id(multi_touch_color)[0]/100.0;"
                green: !lambda "return id(multi_touch_color)[1]/100.0;"
                blue: !lambda "return id(multi_touch_color)[2]/100.0;"
                effect: ${multi_touch_effect}

  - id: led_on_long_touch
    mode: restart
    then:
      - if:
          condition:
            and:
              - lambda: "return !id(ha_neopixel_active).state;"
              - lambda: "return !id(dnd_mode).state;"
          then:
            - light.turn_on:
                id: leds_bottom
                brightness: ${long_press_brightness}
                red: !lambda "return id(long_press_color)[0]/100.0;"
                green: !lambda "return id(long_press_color)[1]/100.0;"
                blue: !lambda "return id(long_press_color)[2]/100.0;"
                effect: ${long_press_effect}
      - script.execute: refresh_led_default

  - id: handle_release
    mode: restart
    parameters:
      pos: int
    then:
      - if:
          condition:
            lambda: "return ${relay_count}==1;"
          then:
            - binary_sensor.template.publish:
                id: touchfield_1
                state: ON

      - if:
          condition:
            lambda: "return ${relay_count}==2;"
          then:
            - if:
                condition:
                  lambda: "return pos <= 5;"
                then:
                  - binary_sensor.template.publish:
                      id: touchfield_1
                      state: ON
                else:
                  - binary_sensor.template.publish:
                      id: touchfield_2
                      state: ON

      - if:
          condition:
            lambda: "return ${relay_count}==3;"
          then:
            - if:
                condition:
                  lambda: "return pos <= 3;"
                then:
                  - binary_sensor.template.publish:
                      id: touchfield_1
                      state: ON
                else:
                  - if:
                      condition:
                        lambda: "return pos <= 7;"
                      then:
                        - binary_sensor.template.publish:
                            id: touchfield_2
                            state: ON
                      else:
                        - binary_sensor.template.publish:
                            id: touchfield_3
                            state: ON

text_sensor:
  - platform: template
    name: "MAC Address"
    id: mac_address_sensor
    icon: "mdi:network"
    entity_category: diagnostic
    lambda: |-
      return WiFi.macAddress().c_str();
